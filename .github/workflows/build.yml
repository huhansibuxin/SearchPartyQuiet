name: Build SearchPartyQuiet

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    strategy:
      matrix:
        variant: [rootless, roothide]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos (Rootless)
        if: matrix.variant == 'rootless'
        run: |
          git clone --recurse-submodules https://github.com/theos/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV

      - name: Setup Theos (Roothide)
        if: matrix.variant == 'roothide'
        run: |
          git clone --recurse-submodules https://github.com/roothide/theos.git ${{ runner.temp }}/theos
          find ${{ runner.temp }}/theos/bin -name "*.pl" -exec sed -i '' '1s|#!/usr/bin/perl|#!/usr/bin/env perl|' {} \;
          echo "THEOS=${{ runner.temp }}/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=roothide" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg ldid

      - name: Install SDK
        run: |
          cd ${{ runner.temp }}/theos/sdks
          curl -sLO https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS16.5.sdk .
          rm -rf sdks-master master.zip

      - name: Verify source discipline
        run: |
          if grep -nE '^[[:space:]]*%(hook|ctor|orig|log|new|end|group)' Tweak.xm; then
            echo "::error::Tweak.xm must stay pure C constructor (no Logos directives)"
            exit 1
          fi
          if grep -n 'MSHookFunction\|SubstrateHook' Tweak.xm; then
            echo "::error::Tweak.xm must not call substrate hooks"
            exit 1
          fi
          echo "OK: pure constructor source"
          grep -c 'Executables' SearchPartyQuiet.plist
          grep 'searchpartyd' SearchPartyQuiet.plist

      - name: Build
        run: make package

      # searchpartyd is a launchd daemon. Any substrate/ellekit/UIKit/Foundation
      # static link means silent dlopen failure or a heavy framework in a small
      # daemon. libsqlite3 is EXPECTED (sqlite3_sql only) - allow it.
      - name: Verify dylib dependency hygiene
        run: |
          DYLIB=$(find .theos -name 'SearchPartyQuiet.dylib' -type f -not -path '*.dSYM*' | head -1)
          if [ -z "$DYLIB" ] || [ ! -f "$DYLIB" ]; then
            echo "::error::SearchPartyQuiet.dylib not found"
            exit 1
          fi
          echo "== $DYLIB =="
          otool -L "$DYLIB"
          DEPS=$(otool -L "$DYLIB" | tail -n +2 | grep -v '@loader_path' || true)
          echo "== real dependencies =="; echo "$DEPS"
          if echo "$DEPS" | grep -qiE 'substrate|ellekit|UIKit|Foundation'; then
            echo "::error::SearchPartyQuiet.dylib links a forbidden heavy/substrate framework"
            exit 1
          fi
          if ! echo "$DEPS" | grep -qi 'libsqlite3'; then
            echo "::error::libsqlite3 not linked (sqlite3_sql would be unresolved)"
            exit 1
          fi
          echo "OK: dependency hygiene (libsqlite3 only, no substrate/ellekit/Foundation/UIKit)"

      - name: Verify build contents
        run: |
          DYLIB=$(find .theos -name 'SearchPartyQuiet.dylib' -type f -not -path '*.dSYM*' | head -1)
          STRINGS=$(strings -a "$DYLIB")
          for NEEDLE in \
            'SearchPartyQuiet 1.0.0 QUIET' \
            'hooked=_sqlite3_step' \
            'readvia=sqlite3_sql' \
            'observedadvertisement' \
            'PROBE_ONLY' \
            'PASSTHROUGH_ALL' \
            'DISABLED' \
            'GUARD' \
            'REBIND' \
            'READY' \
            'quiet.log'; do
            if ! echo "$STRINGS" | grep -qiF "$NEEDLE"; then
              echo "::error::required string missing from dylib: $NEEDLE"
              exit 1
            fi
          done
          echo "OK: build tag + PAC rebind + quiet tables + flags + log path present"
          for FORBIDDEN in 'MSHookFunction' 'logos' 'UIApplication'; do
            if echo "$STRINGS" | grep -qiF "$FORBIDDEN"; then
              echo "::error::unexpected symbol in dylib: $FORBIDDEN"
              exit 1
            fi
          done
          echo "OK: no Logos runtime, no UIKit"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SearchPartyQuiet-${{ matrix.variant }}
          path: packages/*.deb
